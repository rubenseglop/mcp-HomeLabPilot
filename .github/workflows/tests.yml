name: tests

on:
  push:
    branches: [main, feature/complete-homelabpilot]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check agent gateway JavaScript
        run: |
          node --check agent-gateway.mjs
          node --check mcp-readonly-proxy.mjs
          node --check mcp-readonly-policy.mjs
          node --test tests/proxy-policy.test.mjs
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run test suite
        run: pytest -q
