services:
  stackarr:
    build:
      context: .
    container_name: stackarr
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    ports:
      - "${STACKARR_BIND_ADDRESS:-127.0.0.1}:${STACKARR_PORT:-8765}:8000"
    # StackARR uses its own Compose network by default.
    # Attach it to your media apps' networks if you want to use Docker DNS.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
