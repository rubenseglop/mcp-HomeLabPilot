services:
  homelabpilot:
    image: homelabpilot:latest
    build:
      context: .
    container_name: homelabpilot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      HOMELABPILOT_AUDIT_DB_PATH: ${HOMELABPILOT_AUDIT_DB_PATH:-${STACKARR_AUDIT_DB_PATH:-/data/operation-history.sqlite3}}
      HOMELABPILOT_DOCKER_ENABLED: ${HOMELABPILOT_DOCKER_ENABLED:-${STACKARR_DOCKER_ENABLED:-false}}
      HOMELABPILOT_DOCKER_PERMISSION_LEVEL: ${HOMELABPILOT_DOCKER_PERMISSION_LEVEL:-${STACKARR_DOCKER_PERMISSION_LEVEL:-read}}
      HOMELABPILOT_DOCKER_GATEWAY_URL: http://homelabpilot-docker-gateway:2375
      HOMELABPILOT_DOCKER_GATEWAY_TOKEN: ${HOMELABPILOT_DOCKER_GATEWAY_TOKEN:-${STACKARR_DOCKER_GATEWAY_TOKEN:-}}
    ports:
      - "${HOMELABPILOT_BIND_ADDRESS:-${STACKARR_BIND_ADDRESS:-127.0.0.1}}:${HOMELABPILOT_PORT:-${STACKARR_PORT:-8765}}:8000"
    # HomeLabPilot uses its own Compose network by default.
    # Attach it to your media apps' networks if you want to use Docker DNS.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    volumes:
      - homelabpilot_state:/data
    networks:
      - default
      - docker_control
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
  homelabpilot-docker-gateway:
    container_name: homelabpilot-docker-gateway
    image: homelabpilot-docker-gateway:latest
    profiles: [docker]
    build:
      context: .
      dockerfile: Dockerfile.docker-gateway
    restart: unless-stopped
    environment:
      HOMELABPILOT_DOCKER_GATEWAY_TOKEN: ${HOMELABPILOT_DOCKER_GATEWAY_TOKEN:-}
      HOMELABPILOT_DOCKER_ALLOWED_CONTAINERS: ${HOMELABPILOT_DOCKER_ALLOWED_CONTAINERS:-${STACKARR_DOCKER_ALLOWED_CONTAINERS:-}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    networks:
      - docker_control

volumes:
  homelabpilot_state:
    name: homelabpilot_stackarr_state

networks:
  docker_control:
    internal: true
