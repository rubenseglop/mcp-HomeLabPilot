[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homelabpilot-mcp"
version = "0.5.0"
description = "Homelab control plane with an MCP server and web dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.23,<2",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=42,<47",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
homelabpilot = "homelabpilot.server:main"
homelabpilot-mcp = "homelabpilot.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

