[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackarr-mcp"
version = "0.1.0"
description = "Read-only MCP diagnostics for a self-hosted *arr media stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
stackarr-mcp = "stackarr.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
